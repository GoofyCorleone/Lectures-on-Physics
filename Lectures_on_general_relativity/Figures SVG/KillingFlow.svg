<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
  <defs>
    <marker id="kGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/>
    </marker>
    <marker id="kRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b03030"/>
    </marker>
  </defs>
  <style>
    .body{fill:#eef0f8;stroke:#14235c;stroke-width:2.6}
    .lat{fill:none;stroke:#8f97b8;stroke-width:1.4}
    .axis{stroke:#333;stroke-width:1.4;stroke-dasharray:6 5}
    .kv{stroke:#1a7f37;stroke-width:2.8;fill:none}
    .bad{stroke:#b03030;stroke-width:2.8;fill:none}
    .ttl{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-style:italic;fill:#000}
    .sm{font-family:Georgia,'Times New Roman',serif;font-size:15px;fill:#555}
    .lg{font-family:Georgia,'Times New Roman',serif;font-size:18px;fill:#1a7f37}
    .lr{font-family:Georgia,'Times New Roman',serif;font-size:18px;fill:#b03030}
  </style>

  <text class="ttl" x="104" y="34">a symmetry of the metric</text>
  <ellipse class="body" cx="205" cy="205" rx="95" ry="140"/>
  <ellipse class="lat" cx="205" cy="130" rx="73" ry="20"/>
  <ellipse class="lat" cx="205" cy="205" rx="95" ry="26"/>
  <ellipse class="lat" cx="205" cy="280" rx="73" ry="20"/>
  <path class="kv" d="M 300,205 C 296,232 258,247 205,247" marker-end="url(#kGreen)"/>
  <path class="kv" d="M 278,130 C 273,152 244,163 205,163" marker-end="url(#kGreen)"/>
  <line class="axis" x1="205" y1="50" x2="205" y2="360"/>
  <text class="lg" x="308" y="198">&#958;</text>
  <text class="sm" x="52" y="392">the surface is invariant under the rotation, so the</text>
  <text class="sm" x="52" y="412">flow slides it along itself and no distance changes</text>

  <line x1="410" y1="18" x2="410" y2="412" stroke="#cccccc" stroke-width="1.4"/>

  <text class="ttl" x="546" y="34">no symmetry</text>
  <path class="body" d="M 620,65
      C 690,72 715,120 712,160
      C 790,178 792,232 706,244
      C 700,300 672,338 620,345
      C 556,338 525,272 525,205
      C 525,138 556,72 620,65 Z"/>
  <path class="lat" d="M 620,110 C 668,110 700,119 700,131 C 700,143 668,152 620,152 C 572,152 540,143 540,131 C 540,119 572,110 620,110 Z"/>
  <path class="lat" d="M 620,179 C 690,179 762,190 762,205 C 762,220 690,231 620,231 C 566,231 526,220 526,205 C 526,190 566,179 620,179 Z"/>
  <path class="lat" d="M 620,262 C 664,262 694,271 694,283 C 694,295 664,304 620,304 C 576,304 546,295 546,283 C 546,271 576,262 620,262 Z"/>
  <path class="bad" d="M 762,205 C 750,236 690,252 620,252" marker-end="url(#kRed)"/>
  <line class="axis" x1="620" y1="50" x2="620" y2="360"/>
  <text class="lr" x="778" y="180">&#958;</text>
  <text class="sm" x="452" y="392">the same rotation carries the bulge onto a place</text>
  <text class="sm" x="452" y="412">where there is none, so distances change</text>
</svg>
